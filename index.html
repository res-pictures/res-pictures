<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТОВ «РЕЗЕМБЛЕНС ПІКЧЕРЗ» — Цифрова Візитка</title>
    <!-- Підключення бібліотеки QR-кодів -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090a0f 0%, #121824 50%, #050608 100%);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-silver: #e2e8f0;
            --btn-bg: rgba(255, 255, 255, 0.07);
            --btn-hover: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 35px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
        }

        .logo-container svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--btn-bg);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .btn-link:active {
            transform: scale(0.98);
            background: var(--btn-hover);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box svg {
            width: 20px;
            height: 20px;
            fill: var(--accent-silver);
        }

        .arrow-icon {
            opacity: 0.5;
        }

        .arrow-icon svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 14px;
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-action svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* Modal styling */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 999;
            padding: 20px;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #161b26;
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px 24px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .modal-backdrop.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .modal-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .qr-box {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .qr-box img, .qr-box canvas {
            display: block;
            margin: 0 auto;
        }

        .btn-close {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Модальне вікно QR-коду -->
    <div class="modal-backdrop" id="qrModal">
        <div class="modal-card">
            <div class="modal-title">QR-код візитки</div>
            <div class="modal-desc">Покажіть для швидкого відкриття</div>
            <div class="qr-box" id="qrcode"></div>
            <button class="btn-close" id="closeQrBtn">Закрити</button>
        </div>
    </div>

    <div class="toast" id="toast">Посилання скопійовано!</div>

    <script>
        const CARD_URL = "https://res-pictures.github.io/res-pictures/";

        window.addEventListener('DOMContentLoaded', () => {
            new QRCode(document.getElementById("qrcode"), {
                text: CARD_URL,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        const qrModal = document.getElementById('qrModal');
        const showQrBtn = document.getElementById('showQrBtn');
        const closeQrBtn = document.getElementById('closeQrBtn');
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toast');

        showQrBtn.addEventListener('click', () => qrModal.classList.add('active'));
        closeQrBtn.addEventListener('click', () => qrModal.classList.remove('active'));
        qrModal.addEventListener('click', (e) => {
            if (e.target === qrModal) qrModal.classList.remove('active');
        });

        shareBtn.addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'ТОВ «РЕЗЕМБЛЕНС ПІКЧЕРЗ»',
                        text: 'Цифрова візитка ТОВ «РЕЗЕМБЛЕНС ПІКЧЕРЗ»',
                        url: CARD_URL
                    });
                } catch (err) {}
            } else {
                navigator.clipboard.writeText(CARD_URL);
                showToast('Посилання скопійовано!');
            }
        });

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
